<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vincenzo Izzi · Charcoal Artist</title>
<meta name="description" content="Vincenzo Izzi, artista a carboncino nato a Messina. Opere originali e stampe fine art in edizione limitata.">
<meta property="og:title" content="Vincenzo Izzi · Charcoal Artist">
<meta property="og:description" content="Opere originali a carboncino e stampe fine art in edizione limitata.">
<meta property="og:image" content="/images/uploads/samara-1.jpg">
<meta name="theme-color" content="#0b0b0a">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sala buia da museo. Le opere stanno sotto un'unica luce, il resto si ritira nel nero. */
:root {
  --bg: #0b0b0a;          /* nero carbone */
  --panel: #151513;       /* parete in ombra */
  --raise: #1e1e1b;
  --bone: #eceae3;        /* carta e luce */
  --smoke: #b4b1a8;       /* testo secondario */
  --line: #2c2b28;        /* filo sottile */
  --line-strong: #5a5852;
  --sold: #d0705f;
  --display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --max: 1360px;
  --hh: 64px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--bone); font: 400 17px/1.65 var(--ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
a { color: inherit; }
button, select, input, textarea { font: inherit; color: inherit; }
img, canvas, video { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
.wrap { max-width: var(--max); margin-inline: auto; padding-left: var(--gl); padding-right: var(--gr); }
@media (min-width: 760px) { :root { --gl: max(40px, env(safe-area-inset-left, 0px)); --gr: max(40px, env(safe-area-inset-right, 0px)); } }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
.muted { color: var(--smoke); }
.note { font-size: .875rem; line-height: 1.45; color: var(--smoke); }

/* testata */
header.top { position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding-top: env(safe-area-inset-top, 0px); transition: background .35s ease, border-color .35s ease; border-bottom: 1px solid transparent; }
header.top.solid { background: rgba(11,11,10,.94); border-bottom-color: var(--line); backdrop-filter: blur(10px); }
body.is-home header.top:not(.solid) { background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent); }
.notice { background: var(--bone); color: var(--bg); font-size: .8125rem; line-height: 1.4; }
.notice .wrap { padding-block: 8px; text-align: center; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand img { width: 34px; height: 34px; flex: none; }
.brand span { font: 500 1.05rem/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
nav.main { display: flex; align-items: center; gap: 4px 26px; }
nav.main a, .lang, .menu-btn { font-size: .875rem; font-weight: 500; letter-spacing: .02em; text-decoration: none; background: none; border: 0; padding: 6px 0; cursor: pointer; }
nav.main a[aria-current="page"], nav.main a:hover, .lang:hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
.lang { border-left: 1px solid var(--line-strong); padding-left: 18px; }
.count { font-variant-numeric: tabular-nums; }
.menu-btn { display: none; border: 1px solid var(--line-strong); padding: 8px 14px; letter-spacing: .14em; text-transform: uppercase; font-size: .75rem; }
@media (max-width: 960px) {
  .menu-btn { display: inline-flex; }
  nav.main { display: none; }
  .brand span { font-size: .9rem; }
}
/* menu da telefono: un foglio intero, voci grandi separate da un filo */
body.menu-open { overflow: hidden; }
.drawer { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); overflow-y: auto; animation: fadein .25s ease-out both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.drawer[hidden] { display: none; }
.drawer .menu-btn { display: inline-flex; }
.drawer-top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.drawer-links { list-style: none; margin: 0; padding-block: 8px 32px; width: 100%; }
.drawer-links li { animation: rise .5s ease-out both; animation-delay: calc(var(--i) * 60ms); }
.drawer-links a { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 16px; padding-block: 20px; border-bottom: 1px solid var(--line); text-decoration: none; }
.dl-name { font: 500 clamp(2rem, 8.5vw, 2.8rem)/1.05 var(--display); }
.dl-sub { grid-column: 1; font-size: .8125rem; color: var(--smoke); }
.dl-go { grid-row: 1 / span 2; grid-column: 2; font-size: 1.3rem; color: var(--smoke); }
.drawer-links a[aria-current="page"] .dl-name { font-style: italic; }
.drawer-links a[aria-current="page"] .dl-go, .drawer-links a:hover .dl-go { color: var(--bone); }
.drawer-foot { background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-foot .wrap { display: grid; gap: 18px; padding-block: 22px 28px; }
.langs { display: flex; gap: 8px; }
.langs button { min-height: 44px; min-width: 60px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-weight: 600; font-size: .8125rem; letter-spacing: .14em; }
.langs button[aria-pressed="true"] { background: var(--bone); color: var(--bg); border-color: var(--bone); }
.drawer-contacts { display: grid; gap: 6px; font-size: .9375rem; overflow-wrap: anywhere; }
.drawer-contacts a { text-decoration: none; }
@media (min-width: 961px) { .drawer { display: none !important; } }
main { padding-top: var(--hh); min-height: 60vh; }
body.is-home main { padding-top: 0; }

/* copertina */
.hero { position: relative; min-height: clamp(560px, 92svh, 940px); display: grid; place-items: center; overflow: hidden; background: #000; isolation: isolate; }
.hero-media { position: absolute; inset: 0; z-index: -2; }
.hero-media img, .hero-media video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); animation: drift 22s ease-out both; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.15), rgba(0,0,0,.72) 75%), linear-gradient(to top, var(--bg), transparent 30%); }
@keyframes drift { from { transform: scale(1.08); } to { transform: scale(1); } }
.hero-inner { display: grid; justify-items: center; gap: 18px; text-align: center; padding: calc(var(--hh) + 40px) var(--gr) 72px var(--gl); }
.hero .seal { width: clamp(84px, 10vw, 128px); height: auto; animation: rise 1.4s .1s ease-out both; }
.hero h1 { font: 600 clamp(3rem, 11vw, 9.5rem)/.9 var(--display); letter-spacing: 0; text-transform: uppercase; animation: rise 1.4s .25s ease-out both; }
.hero .label { color: var(--bone); opacity: .85; animation: rise 1.4s .4s ease-out both; }
.hero .btn { width: auto; margin-top: 14px; animation: rise 1.4s .55s ease-out both; }
@keyframes rise { from { opacity: .15; transform: translateY(14px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
.scroll-cue { position: absolute; bottom: 22px; left: 50%; translate: -50% 0; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--smoke); text-decoration: none; }

/* bottoni */
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 10px; min-height: 52px; padding: 12px 28px; width: 100%; background: var(--bone); color: var(--bg); border: 1px solid var(--bone); font-weight: 600; font-size: .875rem; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: background .2s, color .2s; }
.btn:hover:not(:disabled) { background: transparent; color: var(--bone); }
.btn.ghost { background: transparent; color: var(--bone); }
.btn.ghost:hover { background: var(--bone); color: var(--bg); }
.btn:disabled { background: var(--raise); color: var(--smoke); border-color: var(--line); cursor: not-allowed; }
.btn.small { width: auto; min-height: 46px; }
.link { background: none; border: 0; padding: 8px 0; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
.link.danger { color: var(--sold); }
.more { font-size: .875rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid var(--line-strong); padding-bottom: 3px; white-space: nowrap; }
.more:hover { border-color: var(--bone); }

/* sezioni */
section.block { padding-block: clamp(64px, 9vw, 128px) 0; }
.head { display: flex; align-items: end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-bottom: clamp(24px, 3vw, 40px); }
.head .label { display: block; margin-bottom: 12px; color: var(--smoke); }
h2 { font: 500 clamp(2rem, 4.6vw, 3.8rem)/1.04 var(--display); letter-spacing: -.01em; text-wrap: balance; }

/* sale: le due porte */
.rooms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 2vw, 28px); }
.room { position: relative; display: grid; align-content: end; min-height: clamp(380px, 46vw, 620px); overflow: hidden; background: var(--panel); text-decoration: none; isolation: isolate; }
.room > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 1.2s ease, filter .6s; filter: grayscale(1) brightness(.8); }
.room::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,.05) 65%); }
.room:hover > img { transform: scale(1.04); filter: grayscale(1) brightness(.95); }
.room-text { display: grid; gap: 10px; padding: clamp(20px, 3vw, 40px); }
.room-name { font: 500 clamp(2rem, 4vw, 3.4rem)/1 var(--display); }
.room-name em { font-style: italic; }
.room-sub { color: var(--smoke); max-width: 40ch; }
.room-go { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding-top: 8px; }
.tagnew { position: absolute; top: 18px; left: 18px; background: var(--bone); color: var(--bg); font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 4px 9px; }

/* artista in breve */
.intro { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 88px); align-items: center; }
.intro .lead { font: 400 clamp(1.35rem, 2.1vw, 1.9rem)/1.36 var(--display); text-wrap: pretty; }
.intro-text { display: grid; gap: 28px; justify-items: start; min-width: 0; }
.sign { width: clamp(150px, 18vw, 230px); height: auto; filter: invert(1); opacity: .9; }

/* schede opere */
.grid { display: grid; gap: clamp(40px, 5vw, 64px) clamp(16px, 2.6vw, 36px); grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { display: grid; gap: 14px; align-content: start; text-decoration: none; min-width: 0; }
.frame { position: relative; background: var(--panel); overflow: hidden; }
.frame img { width: 100%; height: auto; }
.frame.fit img { aspect-ratio: 4 / 5; object-fit: contain; padding: 8%; transition: transform .9s ease; }
.card:hover .frame.fit img { transform: scale(1.03); }
.tag { position: absolute; left: 10px; bottom: 10px; background: rgba(11,11,10,.82); color: var(--bone); font-size: .6875rem; font-weight: 500; line-height: 1.2; padding: 4px 8px; }
.card h3 { font: 500 1.35rem/1.15 var(--display); }
.card:hover h3 { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
.rule { width: 36px; height: 1px; background: var(--line-strong); }
.card .meta { font-size: .875rem; line-height: 1.45; color: var(--smoke); }
.card .row { display: flex; justify-content: space-between; gap: 12px; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.state { font-weight: 500; }
.state.sold { color: var(--sold); }

/* Discover */
.events { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(32px, 4vw, 56px) clamp(16px, 2.6vw, 36px); }
.event { display: grid; gap: 14px; align-content: start; min-width: 0; text-decoration: none; }
.event .frame img { aspect-ratio: 16 / 10; object-fit: cover; filter: grayscale(1); transition: transform 1s ease; }
.event:hover .frame img { transform: scale(1.03); }
.event h3 { font: 500 clamp(1.5rem, 2.4vw, 2.1rem)/1.1 var(--display); }
.event .when { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: baseline; font-size: .9375rem; }
.pill { font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line-strong); padding: 3px 8px; }
.pill.on { background: var(--bone); color: var(--bg); border-color: var(--bone); }
.event p.txt { color: var(--smoke); max-width: 60ch; }

/* invito ai contatti */
.cta { margin-top: clamp(80px, 10vw, 140px); border-block: 1px solid var(--line); }
.cta .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 48px; align-items: center; padding-block: clamp(48px, 7vw, 96px); }
.cta h2 { max-width: 20ch; }

/* pagine interne */
.page-head { padding-block: clamp(40px, 6vw, 88px) clamp(28px, 3.5vw, 48px); display: grid; gap: 14px; }
.page-head h1 { font: 600 clamp(2.8rem, 8vw, 6.6rem)/.98 var(--display); letter-spacing: -.02em; }
.page-head p { max-width: 58ch; }
.tabs { display: flex; gap: 8px 28px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: clamp(32px, 4vw, 52px); }
.tabs a { text-decoration: none; padding: 10px 0 12px; font-size: .875rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--smoke); border-bottom: 1px solid transparent; margin-bottom: -1px; }
.tabs a[aria-current="page"], .tabs a:hover { color: var(--bone); border-color: var(--bone); }

/* artista */
.masthead { display: flex; align-items: center; gap: clamp(16px, 2.6vw, 34px); padding-block: clamp(40px, 6vw, 80px) clamp(32px, 4vw, 56px); }
.masthead .seal { width: clamp(72px, 11vw, 140px); height: auto; flex: none; }
.masthead h1 { font: 600 clamp(2.6rem, 9vw, 8rem)/.92 var(--display); letter-spacing: -.02em; text-transform: uppercase; min-width: 0; }
.bio { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 80px); align-items: start; }
.bio .portrait { position: sticky; top: calc(var(--hh) + 24px); }
.bio-text { display: grid; gap: 22px; min-width: 0; }
.bio .portrait img, .intro > .frame img { filter: grayscale(1) contrast(1.05); }
.bio-text .lead { font: 400 clamp(1.35rem, 2vw, 1.75rem)/1.36 var(--display); }
.bio-text p:not(.lead) { max-width: 64ch; color: var(--bone); }
.statement { display: grid; gap: 24px; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); }
.statement .label { color: var(--smoke); }
.statement blockquote { margin: 0; display: grid; gap: 22px; max-width: 62ch; font: 400 clamp(1.1rem, 1.5vw, 1.3rem)/1.7 var(--ui); color: var(--bone); text-wrap: pretty; }
.cv { display: grid; gap: 32px clamp(24px, 4vw, 64px); grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); padding-top: 28px; }
.cv > div { display: grid; gap: 10px; align-content: start; min-width: 0; }
.cv .label { color: var(--smoke); }
.cv p { font-size: .9375rem; line-height: 1.5; }

/* scheda opera */
.back { display: inline-block; font-size: .875rem; padding-top: 24px; text-decoration: none; color: var(--smoke); }
.back:hover { color: var(--bone); }
.product { display: grid; gap: clamp(28px, 5vw, 80px); grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; padding-block: clamp(20px, 3vw, 40px) 0; }
.product .info { position: sticky; top: calc(var(--hh) + 24px); display: grid; gap: 22px; min-width: 0; }
.product h1 { font: 600 clamp(2.3rem, 4.4vw, 3.8rem)/1.02 var(--display); letter-spacing: -.01em; }
.gallery { display: grid; gap: 10px; min-width: 0; }
.gallery .frame img { aspect-ratio: 4 / 5; object-fit: contain; padding: 5%; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.thumb { padding: 0; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.thumb[aria-pressed="true"] { border-color: var(--bone); }
.thumb img { width: 100%; aspect-ratio: 4 / 5; height: auto; object-fit: cover; }
.specs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 22px; margin: 0; font-size: .9375rem; border-block: 1px solid var(--line); padding-block: 16px; }
.specs dt { color: var(--smoke); }
.specs dd { margin: 0; }
.sizes { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.sizes legend { padding: 0 0 10px; color: var(--smoke); }
.size { display: flex; justify-content: space-between; gap: 12px; align-items: center; width: 100%; padding: 13px 16px; border: 1px solid var(--line-strong); background: transparent; text-align: left; cursor: pointer; font-variant-numeric: tabular-nums; }
.size[aria-pressed="true"] { border-color: var(--bone); box-shadow: inset 0 0 0 1px var(--bone); }
.size:disabled { color: var(--smoke); cursor: not-allowed; text-decoration: line-through; }
.price { font: 500 2.3rem/1 var(--display); font-variant-numeric: tabular-nums lining-nums; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: .8125rem; font-weight: 500; color: var(--smoke); }
.field select, .field input, .field textarea { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 0; }
.field input[type="file"] { border: 0; padding: 10px 0; background: none; }
.field select:focus, .field input:focus, .field textarea:focus { border-color: var(--bone); outline: none; }
.contact { display: grid; gap: 12px; padding: 22px; background: var(--panel); font-size: .9375rem; overflow-wrap: anywhere; justify-items: start; }
.contact .btn { width: 100%; }
.contact-title { font: 500 1.6rem/1.2 var(--display); }
.care { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px clamp(20px, 4vw, 56px); font-size: .9375rem; line-height: 1.55; }
.care > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
.care .label { color: var(--smoke); }
.info .care { grid-template-columns: minmax(0, 1fr); border-top: 1px solid var(--line); padding-top: 18px; }
.ship { display: grid; gap: 12px; }
.ship-line { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }

/* carrello e ordine */
.cart { display: grid; gap: clamp(28px, 5vw, 72px); grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
.lines { display: grid; border-top: 1px solid var(--line-strong); }
.line { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 18px; padding-block: 18px; border-bottom: 1px solid var(--line); align-items: start; }
.line img { background: var(--panel); }
.line h3 { font: 500 1.2rem/1.2 var(--display); }
.line a { text-decoration: none; }
.line .sub { font-size: .875rem; color: var(--smoke); }
.qty { display: flex; align-items: center; gap: 10px; padding-top: 10px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.qty button { min-width: 34px; min-height: 34px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; }
.qty button:disabled { color: var(--line-strong); cursor: not-allowed; }
.qty .rm { border: 0; min-width: 0; text-decoration: underline; text-underline-offset: 3px; font-size: .875rem; color: var(--smoke); }
.summary { display: grid; gap: 16px; position: sticky; top: calc(var(--hh) + 24px); padding: 24px; background: var(--panel); }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-top: 1px solid var(--line-strong); padding-top: 16px; font: 500 1.9rem/1.1 var(--display); font-variant-numeric: tabular-nums lining-nums; }
.empty { display: grid; gap: 20px; max-width: 34rem; padding-bottom: 20px; justify-items: start; }
.empty h2 { font-size: clamp(1.8rem, 3vw, 2.4rem); }
.table-box { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 360px; font-variant-numeric: tabular-nums; font-size: .9375rem; }
td { text-align: right; padding: 14px 10px; border-bottom: 1px solid var(--line); }
td:first-child { text-align: left; padding-left: 0; }
.receipt { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: 16px; background: var(--panel); font: inherit; font-size: .9375rem; }
.a-form { display: grid; gap: 18px; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.status { min-height: 1.5em; font-weight: 500; }
.status.bad { color: var(--sold); }
.check { display: flex; gap: 10px; align-items: flex-start; }

/* contatti */
.contacts { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 5vw, 80px); align-items: start; }
.direct { display: grid; gap: 22px; }
.direct > div { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 14px; overflow-wrap: anywhere; }
.direct .big { font: 500 1.5rem/1.25 var(--display); text-decoration: none; }
.direct .big:hover { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
.sendbox { display: grid; gap: 10px; }

/* piè di pagina */
footer { margin-top: clamp(72px, 9vw, 120px); border-top: 1px solid var(--line); }
.cta + footer { margin-top: 0; border-top: 0; }
.foot { display: grid; gap: 32px; grid-template-columns: 1.4fr 1fr 1fr 1fr; padding-block: 48px 40px; font-size: .9375rem; }
.foot > div { display: grid; gap: 8px; align-content: start; min-width: 0; overflow-wrap: anywhere; }
.foot .label { color: var(--smoke); margin-bottom: 4px; }
.foot ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.foot a { text-decoration: none; }
.foot a:hover { text-decoration: underline; text-underline-offset: 4px; }
.foot-brand { display: grid; gap: 14px; justify-items: start; }
.foot-brand img { width: 64px; height: 64px; }
.foot-brand p { font: 500 1.3rem/1.2 var(--display); text-transform: uppercase; letter-spacing: .06em; }
.legal { border-top: 1px solid var(--line); }
.legal .wrap { display: flex; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; padding-block: 18px; font-size: .8125rem; color: var(--smoke); }

/* gestione */
.admin { display: grid; gap: 8px; }
.a-sec { display: grid; gap: 18px; padding-block: 32px; border-top: 1px solid var(--line-strong); }
.a-sec h2 { font-size: clamp(1.6rem, 2.8vw, 2.2rem); }
.a-sec .head { padding: 0; align-items: center; }
.a-list { display: grid; }
.a-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.a-main { display: grid; min-width: 0; }
.a-price { font-variant-numeric: tabular-nums; }
.a-thumb img { width: 100%; height: auto; background: var(--panel); }
.a-thumb.big { width: 160px; flex: none; }
.a-thumb.wide { width: 240px; flex: none; }
.a-photo { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.a-variants { display: grid; gap: 10px; justify-items: start; }
#variants { width: 100%; }
.v-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; padding-bottom: 12px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; width: 100%; }
.slot { display: grid; gap: 6px; align-content: start; min-width: 0; }
.slot img { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; background: var(--panel); }
.slot-tools { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.slot-tools .link, .slot-tools .note { padding: 2px 0; font-size: .8125rem; }
.slot.add { aspect-ratio: 4 / 5; place-content: center; border: 1px dashed var(--line-strong); background: transparent; font-weight: 500; cursor: pointer; }
.file-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; }
.a-actions { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.o-card { display: grid; gap: 10px; padding-block: 18px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.o-head { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: baseline; }

@media (max-width: 960px) {
  .grid, .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .intro, .bio, .product, .cart, .statement, .contacts { grid-template-columns: minmax(0, 1fr); }
  .bio .portrait, .product .info, .summary { position: static; }
  .cv { grid-template-columns: minmax(0, 1fr); }
  .foot { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 680px) {
  .rooms, .events, .care, .two { grid-template-columns: minmax(0, 1fr); }
  .cta .wrap { grid-template-columns: minmax(0, 1fr); }
  .foot { grid-template-columns: minmax(0, 1fr); }
  .v-row { grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--line); padding-block: 12px; }
  .a-row { grid-template-columns: 48px minmax(0, 1fr) auto; }
  .a-price { display: none; }
  .a-thumb.wide { width: 100%; }
}
@media (max-width: 440px) {
  .grid, .grid.three { gap: 36px 12px; }
  .card h3 { font-size: 1.1rem; }
  .line { grid-template-columns: 72px minmax(0, 1fr); }
  .line .amount { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
.footer-admin { color: var(--smoke); text-decoration: none; }
.footer-admin:hover { color: var(--bone); }

const artCache = {};
function makeArt(seed, w, h, dark) {
  const key = `${seed}-${w}-${h}-${dark ? 1 : 0}`;
  if (artCache[key]) return artCache[key];
  let s = seed * 7919 + 13;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.fillStyle = dark ? "#121210" : "#e9e7e1"; x.fillRect(0, 0, w, h);
  const ink = dark ? "236,234,227" : "10,10,9", chalk = dark ? "10,10,9" : "240,238,232";
  const cx = w * (.35 + r() * .3), cy = h * (.32 + r() * .3);
  const rx = w * (.2 + r() * .1), ry = h * (.2 + r() * .1);
  x.lineCap = "round";
  for (let i = 0; i < 2600; i++) {
    const px = r() * w, py = r() * h;
    const d = Math.hypot((px - cx) / rx, (py - cy) / ry);
    if (d < .55 + r() * .75) continue;
    const a = r() * .7 + 1.2, len = 30 + r() * (w * .22);
    x.strokeStyle = `rgba(${ink},${(dark ? .03 : .07) + r() * (dark ? .08 : .2)})`;
    x.lineWidth = 1 + r() * 12;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len); x.stroke();
  }
  for (let i = 0; i < 26; i++) {
    x.strokeStyle = `rgba(${ink},${(dark ? .12 : .25) + r() * .4})`;
    x.lineWidth = 1 + r() * 5;
    const a = r() * Math.PI * 2, b = a + 1 + r() * 2;
    x.beginPath(); x.ellipse(cx + (r() - .5) * 30, cy + (r() - .5) * 30, rx * (.75 + r() * .5), ry * (.75 + r() * .5), r(), a, b); x.stroke();
  }
  for (let i = 0; i < 14; i++) {
    x.strokeStyle = `rgba(${chalk},${.25 + r() * .5})`;
    x.lineWidth = 2 + r() * 16;
    const a = r() * Math.PI, l = 60 + r() * w * .4, px = r() * w, py = r() * h;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  const img = x.getImageData(0, 0, w, h), p = img.data;
  for (let i = 0; i < p.length; i += 4) { const n = (r() - .5) * 26; p[i] += n; p[i+1] += n; p[i+2] += n; }
  x.putImageData(img, 0, 0);
  return artCache[key] = c.toDataURL("image/jpeg", .82);
}
function picture(assetId, seed, alt, w = 640, h = 800, dark = false) {
  const src = assetId ? blob(assetId) : makeArt(seed, w, h, dark);

}

}
function orderField(id, label, opts = {}) {
  const v = draft[id] ?? "";
  const attrs = `id="o-${id}" name="${id}" autocomplete="${opts.ac || "on"}" ${opts.req === false ? "" : "required"}`;
  return `<div class="field"><label for="o-${id}">${label}</label>${opts.area ? `<textarea ${attrs} rows="3">${esc(v)}</textarea>` : `<input ${attrs} type="${opts.type || "text"}" value="${esc(v)}">`}</div>`;
}
function viewOrder() {
  const items = cartItems();
  if (!items.length) return viewCart();
  const intl = country === "INT";
  const subtotal = items.reduce((sum, i) => sum + i.v.price * i.qty, 0);
  const shipping = shippingCost(true);
  return `<div class="wrap">
    <a class="back" href="#carrello">← ${t("cartTitle")}</a>
    <div class="page-head"><h1>${t("orderTitle")}</h1></div>
    <div class="cart">
      <form id="orderForm" class="a-form" novalidate>
        <p class="status" id="orderMsg" aria-live="polite"></p>
        <div class="two">${orderField("firstName", t("firstName"), { ac:"given-name" })}${orderField("lastName", t("lastName"), { ac:"family-name" })}</div>
        <div class="two">${orderField("email", t("email"), { type:"email", ac:"email" })}${orderField("phone", t("phone"), { type:"tel", ac:"tel" })}</div>
        ${orderField("address", t("address"), { ac:"street-address" })}
        <div class="two">${orderField("zip", t("zip"), { ac:"postal-code" })}${orderField("city", t("city"), { ac:"address-level2" })}</div>
        <div class="two">${orderField("region", t(intl ? "region" : "province"), { ac:"address-level1" })}${intl ? orderField("country", t("countryName"), { ac:"country-name" }) : ""}</div>
        ${orderField("notes", t("notes"), { area:true, req:false })}
        <button class="btn" type="submit">${t("confirmOrder")}</button>
      </form>
      <aside class="summary">
        <p class="label">${t("summaryTitle")}</p>
        ${items.map(i => `<div class="ship-line"><span>${esc(title(i.w))}, ${esc(i.v.size)}${i.qty > 1 ? ` × ${i.qty}` : ""}</span><span>${money(i.v.price * i.qty)}</span></div>`).join("")}
        <div class="ship-line"><span>${t("shipTo")}: ${t(intl ? "shipOptINT" : "shipOptIT")}</span><span>${money(shipping)}</span></div>
        <div class="total"><span>${t("total")}</span><span>${money(subtotal + shipping)}</span></div>
        <p class="note"><a href="#carrello">${t("changeShip")}</a></p>
      </aside>
    </div></div>`;
}
const orderText = o => [
  `${o.no}`, `${o.buyer.firstName} ${o.buyer.lastName}`, o.buyer.email, o.buyer.phone,
  o.buyer.address, `${o.buyer.zip} ${o.buyer.city} (${o.buyer.region})`, o.buyer.country,
  o.buyer.notes, "", ...o.items.map(i => `${i.title}, ${i.size} × ${i.qty}: ${money(i.price * i.qty)}`),
  `${t("shipTo")}: ${money(o.shipping)}`, `${t("total")}: ${money(o.total)}`
].filter(x => x !== undefined).join("\n");
function viewDone() {
  const o = lastOrder;
  if (!o) return viewCart();
  const url = `https://www.paypal.me/${encodeURIComponent(S.paypal)}/${o.total.toFixed(2)}EUR`;
  return `<div class="wrap"><div class="empty">
    <div class="page-head"><h1>${t("doneTitle")}</h1><p>${t("doneNo")(esc(o.no))}</p></div>
    <p class="price">${money(o.total)}</p>
    <p class="label">${t("step1")}</p>
    <a class="btn" href="${url}" target="_blank" rel="noopener">${t("payCard")}</a>
    <p class="label">${t("step2")}</p>
    <a class="btn ghost" href="${waLink(t("waIntro") + (o.demo ? " (prova)" : "") + "\n\n" + orderText(o))}" target="_blank" rel="noopener">${t("sendWa")}</a>
    <p class="note">${t("waHelp")}</p>
    ${o.saved ? "" : `<pre class="receipt" id="receipt">${esc(orderText(o))}</pre><button type="button" class="link" id="copyOrder">${t("copy")}</button>`}
  </div></div>`;
}
async function submitOrder(form) {
  const msg = document.getElementById("orderMsg");
  const missing = [...form.querySelectorAll("[required]")].find(x => !x.value.trim());
  if (missing) { msg.textContent = t("required"); msg.classList.add("bad"); missing.focus(); return; }
  const mail = form.querySelector("#o-email");
  if (!mail.checkValidity()) { msg.textContent = t("badEmail"); msg.classList.add("bad"); mail.focus(); return; }
  const items = cartItems();
  if (!items.length) { render(); return; }
  const buyer = {};
  [...form.elements].forEach(x => { if (x.name) buyer[x.name] = x.value.trim(); });
  if (country !== "INT") buyer.country = "Italia";
  const subtotal = items.reduce((sum, i) => sum + i.v.price * i.qty, 0);
  const shipping = shippingCost(true);
  const order = {
    no:"VI-" + Date.now().toString(36).toUpperCase().slice(-6), date:new Date().toISOString(), status:"new", demo:!!S.demo,
    zone:country, buyer, shipping, subtotal, total:subtotal + shipping,
    items:items.map(i => ({ id:i.w.id, v:i.v0, title:i.w.titleIt, size:i.v.size, price:i.v.price, qty:i.qty }))
  };
  let saved = false;
  try {
    const b = order.buyer;
    const fields = { "form-name":"ordine", numero:order.no, data:new Date(order.date).toLocaleString("it-IT"), nome:b.firstName, cognome:b.lastName, email:b.email, telefono:b.phone,
      indirizzo:b.address, cap:b.zip, citta:b.city, provincia:b.region, paese:b.country, note:b.notes || "",
      articoli:order.items.map(i => `${i.title}, ${i.size} x ${i.qty}: ${money(i.price * i.qty)}`).join("\n"),
      spedizione:money(order.shipping), totale:money(order.total), prova:order.demo ? "sì" : "no" };
    const res = await fetch("/", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:new URLSearchParams(fields).toString() });
    saved = res.ok;
  } catch (e) {}
  lastOrder = { ...order, saved };
  cart = []; save("vi-cart", cart); draft = {};
  location.hash = "conferma";
}

/* ===== Struttura e navigazione ===== */
function renderChrome(route) {
  document.documentElement.lang = lang;
  const n = S.notice || {};
  const noticeText = n.on && (n[lang] || n.it) ? n[lang] || n.it : S.demo ? t("preview") : "";
  document.getElementById("noticeText").textContent = noticeText;
  document.getElementById("notice").hidden = !noticeText;
  const w = byId(route);
  const isColl = ["collezione","originali","stampe","disponibili"].includes(route) || !!w;
  const cur = on => on ? ' aria-current="page"' : "";
  const curO = route === "originali" || (w && w.type === "original");
  const curP = route === "stampe" || (w && w.type === "print");
  const nCart = cartItems().reduce((s, i) => s + i.qty, 0);
  const curCart = ["carrello","ordine","conferma"].includes(route);
  document.getElementById("nav").innerHTML = `
    <a href="#artista"${cur(route === "artista")}>${t("bio")}</a>
    <a href="#originali"${cur(curO)}>${t("originals")}</a>
    <a href="#stampe"${cur(curP)}>${t("prints")}</a>
    <a href="#contatti"${cur(route === "contatti")}>${t("contacts")}</a>
    <a href="#carrello"${cur(curCart)}>${t("cart")} <span class="count">(${nCart})</span></a>
    <button type="button" class="lang" id="lang" aria-label="${t("langName")}">${t("langBtn")}</button>`;
  const items = [["home", t("home"), t("subHome"), route === "home"], ["artista", t("bio"), t("subBio"), route === "artista"], ["originali", t("doorO"), t("subO"), curO], ["stampe", t("doorP"), t("subP"), curP],
    ["contatti", t("contacts"), t("subC"), route === "contatti"], ["carrello", `${t("cart")} <span class="count">(${nCart})</span>`, t("subCart")(nCart), curCart]];
  document.getElementById("drawer").innerHTML = `
    <div class="wrap drawer-top"><a class="brand" href="#home"><img src="assets/logo.png" width="360" height="360" alt=""><span>Vincenzo Izzi</span></a>
      <button type="button" class="menu-btn" id="menuClose">${t("close")} ✕</button></div>
    <ul class="wrap drawer-links">${items.map(([r, name, sub, on], i) => `<li style="--i:${i}"><a href="#${r}"${cur(on)}><span class="dl-name">${name}</span><span class="dl-sub">${esc(sub)}</span><span class="dl-go" aria-hidden="true">→</span></a></li>`).join("")}</ul>
    <div class="drawer-foot"><div class="wrap">
      <div class="langs" role="group" aria-label="Lingua / Language"><button type="button" data-lang="it" aria-pressed="${lang === "it"}">IT</button><button type="button" data-lang="en" aria-pressed="${lang === "en"}">EN</button></div>
      <div class="drawer-contacts"><a href="${waLink(t("askText")("le opere"))}" target="_blank" rel="noopener">WhatsApp ${esc(phoneLabel(S.whatsapp))}</a><span>${esc(S.email)}</span><a href="${esc(S.instagram)}" target="_blank" rel="noopener">${esc(S.instagramName)}</a></div>
    </div></div>`;
  document.getElementById("menuBtn").textContent = t("menu");
  document.getElementById("footer").innerHTML = `<div class="wrap foot">
      <div class="foot-brand"><img src="assets/logo.png" width="360" height="360" alt=""><p>Vincenzo Izzi</p><p class="note">${t("based")}</p></div>
      <div><p class="label">${t("contacts")}</p><a href="${waLink(t("askText")("le opere"))}" target="_blank" rel="noopener">WhatsApp ${esc(phoneLabel(S.whatsapp))}</a><span>${esc(S.email)}</span><a href="${esc(S.instagram)}" target="_blank" rel="noopener">${esc(S.instagramName)}</a></div>
      <div><p class="label">${t("site")}</p><ul><li><a href="#originali">${t("doorO")}</a></li><li><a href="#stampe">${t("doorP")}</a></li><li><a href="#artista">${t("bio")}</a></li><li><a href="#contatti">${t("contacts")}</a></li><li><a href="#spedizioni">${t("shipTitle")}</a></li></ul></div>
      <div><p class="label">${t("legal")}</p><p class="note">${t("legalMissing")}</p></div>
    </div>
    <div class="legal"><div class="wrap"><span>© ${new Date().getFullYear()} Vincenzo Izzi. ${lang === "it" ? "Tutti i diritti sulle immagini delle opere sono riservati." : "All rights to the artwork images are reserved."}</span><a class="footer-admin" href="/gestione/">${t("manage")}</a></div></div>`;
  setHeader();
}
function setHeader() {
  const home = getRoute() === "home";
  document.body.classList.toggle("is-home", home);
  document.getElementById("top").classList.toggle("solid", !home || window.scrollY > 40 || document.body.classList.contains("menu-open"));
  document.documentElement.style.setProperty("--hh", document.getElementById("top").offsetHeight + "px");
}
const getRoute = () => (location.hash || "#home").slice(1) || "home";
function render(keepScroll) {
  const route = getRoute();
  if (route.startsWith("gestione")) { location.href = "/admin/"; return; }
  const view = document.getElementById("view");
  const w = byId(route);
  view.innerHTML = w && !w.hidden ? viewWork(w)
    : route === "collezione" ? viewCollection("all")
    : route === "originali" ? viewCollection("original")
    : route === "stampe" ? viewCollection("print")
    : route === "disponibili" ? viewCollection("available")
    : route === "artista" ? viewArtist()
    : route === "contatti" ? viewContacts()
    : route === "carrello" ? viewCart()
    : route === "spedizioni" ? viewShipping()
    : route === "ordine" ? viewOrder()
    : route === "conferma" ? viewDone()
    : viewHome();
  renderChrome(route);
  if (!keepScroll) window.scrollTo({ top:0, behavior:"auto" });
}
/* Durante la compilazione di un modulo i dati in arrivo non cancellano ciò che si sta scrivendo. */
const refresh = () => {
  const r = getRoute();
  if (r === "ordine" || r === "contatti") { renderChrome(r); return; }
  render(true);
};
function setMenu(open) {
  const d = document.getElementById("drawer"), b = document.getElementById("menuBtn");
  if (d.hidden === !open) return;
  d.hidden = !open;
  document.body.classList.toggle("menu-open", open);
  b.setAttribute("aria-expanded", String(open));
  if (open) document.getElementById("menuClose")?.focus(); else b.focus({ preventScroll:true });
}
const closeMenu = () => setMenu(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
function copyText(text, el) {
  navigator.clipboard.writeText(text).then(() => { el.textContent = t("copied"); }).catch(() => {});
}

document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (e.target.closest("#drawer a")) closeMenu();
  if (!el) return;
  if (el.id === "menuBtn") { setMenu(true); return; }
  if (el.id === "menuClose") { closeMenu(); return; }
  if (el.dataset.lang) { lang = el.dataset.lang; save("vi-lang", lang); render(true); return; }
  if (el.id === "copyOrder") { copyText(document.getElementById("receipt").textContent, el); return; }
  if (el.id === "copyMsg") { copyText(document.getElementById("msgText").textContent, el); return; }
  if (el.id === "copyEmail") { copyText(S.email, el); return; }
  if (el.id === "lang") { lang = lang === "it" ? "en" : "it"; save("vi-lang", lang); closeMenu(); render(true); return; }
  const w = byId(getRoute());
  if (el.dataset.shot !== undefined && w) { shot[w.id] = Number(el.dataset.shot); render(true); return; }
  if (el.dataset.size !== undefined && w) { chosen[w.id] = Number(el.dataset.size); justAdded = null; render(true); return; }
  if (el.id === "add" && w && w.type === "print") {
    const v = chosen[w.id];
    const line = cart.find(c => c.id === w.id && c.v === v);
    if (line) line.qty += 1; else cart.push({ id:w.id, v, qty:1 });
    save("vi-cart", cart); justAdded = w.id; render(true); return;
  }
  if (el.dataset.rm !== undefined) { cart.splice(Number(el.dataset.rm), 1); save("vi-cart", cart); render(true); return; }
  if (el.dataset.inc !== undefined) { cart[Number(el.dataset.inc)].qty += 1; save("vi-cart", cart); render(true); return; }
  if (el.dataset.dec !== undefined) {
    const n = Number(el.dataset.dec);
    cart[n].qty -= 1;
    if (cart[n].qty < 1) cart.splice(n, 1);
    save("vi-cart", cart); render(true);
  }
});
document.addEventListener("input", e => { if (e.target.name && (e.target.id.startsWith("o-") || e.target.id.startsWith("c-"))) draft[e.target.name] = e.target.value; });
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "c-topic") { draft.ctopic = el.value; return; }
  if (el.id === "country") { country = el.value; save("vi-country", country); render(true); document.getElementById("country")?.focus(); return; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target;
  if (form.id === "orderForm") submitOrder(form);
  if (form.id === "contactMsgForm") {
    const text = form.querySelector("#c-text").value.trim(), name = form.querySelector("#c-name").value.trim();
    const topic = t(form.querySelector("#c-topic").value);
    const m = document.getElementById("cMsg");
    if (!text) { m.textContent = t("writeMsg"); m.classList.add("bad"); form.querySelector("#c-text").focus(); return; }
    m.textContent = "";
    contactMsg = { subject:`${topic} · ${name || "Sito"}`, body:`${t("askText")(topic)}\n\n${text}${name ? `\n\n${name}` : ""}` };
    document.getElementById("sendBox").innerHTML = sendLinks(contactMsg);
  }
});
window.addEventListener("hashchange", () => { closeMenu(); justAdded = null; contactMsg = null; render(false); });
window.addEventListener("scroll", () => { if (getRoute() === "home") setHeader(); }, { passive:true });
window.addEventListener("resize", setHeader);

/* I contenuti arrivano dai file che si modificano dal pannello /admin. */
const asList = v => Array.isArray(v) ? v.filter(Boolean).map(x => typeof x === "string" ? x : x && x.image).filter(Boolean) : [];
const num = (v, d = null) => v === "" || v === null || v === undefined || isNaN(Number(v)) ? d : Number(v);
function normalize(w) {
  const images = asList(w.images);
  return { ...w, images, image:images[0] || w.image || null, year:num(w.year), edition:num(w.edition), order:num(w.order, 0), release:w.release || null,
    variants:(w.variants || []).map(v => ({ size:String(v.size || ""), price:num(v.price, 0), stock:Math.max(0, num(v.stock, 0)) })).filter(v => v.size && v.price > 0) };
}
async function boot() {
  render(true);
  const timer = setTimeout(() => { if (dbState === "loading") { dbState = "slow"; refresh(); } }, 10000);
  try {
    /* Prima i dati salvati dalla pagina /gestione, poi i file di partenza. */
    const live = await fetch("/api/data", { cache:"no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
    const [works, settings] = await Promise.all([
      Array.isArray(live.works) ? live.works : fetch("/data/works.json", { cache:"no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      live.settings || fetch("/content/settings.json", { cache:"no-cache" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ]);
    S = { ...DEFAULTS, ...settings, notice:{ ...DEFAULTS.notice, ...(settings.notice || {}) }, texts:settings.texts || {} };
    S.shipIT = num(S.shipIT, DEFAULTS.shipIT); S.shipINT = num(S.shipINT, DEFAULTS.shipINT);
    S.whatsapp = String(S.whatsapp || "").replace(/\D/g, "") || DEFAULTS.whatsapp;
    WORKS = works.map(normalize).filter(w => w.variants.length).sort((a, b) => a.order - b.order);
    dbState = "ready";
  } catch (e) { dbState = "slow"; }
  clearTimeout(timer);
  render(true);
}
/* All'ora del drop l'opera passa in vendita senza ricaricare la pagina. */
let lastStates = "";
setInterval(() => { const s = WORKS.map(stateOf).join(); if (s !== lastStates) { lastStates = s; refresh(); } }, 20000);
boot();
</script>
</body>
</html>
