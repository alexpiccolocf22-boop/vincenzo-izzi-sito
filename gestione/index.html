<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vincenzo Izzi · Gestione</title>
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Gestione: stessa sala buia del sito, ma pensata per lavorare: liste chiare, campi grandi, un solo pulsante per salvare. */
:root {
  --bg: #0b0b0a; --panel: #151513; --raise: #1e1e1b; --bone: #eceae3; --smoke: #b4b1a8;
  --line: #2c2b28; --line-strong: #5a5852; --ok: #8fc79a; --bad: #e0806f;
  --display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--bone); font: 400 16px/1.55 var(--ui); -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom, 0px); }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
.wrap { max-width: 1100px; margin-inline: auto; padding-left: var(--gl); padding-right: var(--gr); }
@media (min-width: 760px) { :root { --gl: max(32px, env(safe-area-inset-left, 0px)); --gr: max(32px, env(safe-area-inset-right, 0px)); } }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--smoke); }
.muted { color: var(--smoke); }
.note { font-size: .875rem; color: var(--smoke); }

/* accesso */
.login { min-height: 100svh; display: grid; place-items: center; padding: 32px var(--gr) 32px var(--gl); }
.login form { width: min(100%, 400px); display: grid; gap: 18px; justify-items: center; text-align: center; }
.login img { width: 96px; height: 96px; }
.login h1 { font: 600 2rem/1.1 var(--display); }
.login .field { width: 100%; text-align: left; }

/* testata */
header { position: sticky; top: 0; z-index: 20; background: rgba(11,11,10,.95); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); padding-top: env(safe-area-inset-top, 0px); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 32px; height: 32px; }
.brand b { font: 600 1rem/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.brand span { color: var(--smoke); font-size: .875rem; }
.bar-links { display: flex; gap: 18px; align-items: center; font-size: .875rem; }
.tabs { display: flex; gap: 4px 24px; overflow-x: auto; border-top: 1px solid var(--line); scrollbar-width: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 0; font-weight: 500; color: var(--smoke); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--bone); border-color: var(--bone); }

main { padding-block: 28px 80px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px 20px; flex-wrap: wrap; padding-bottom: 20px; }
h2 { font: 600 clamp(1.7rem, 3.4vw, 2.4rem)/1.1 var(--display); }
h3 { font: 600 1.25rem/1.2 var(--display); }

/* pulsanti e campi */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 22px; background: var(--bone); color: var(--bg); border: 1px solid var(--bone); font-weight: 600; font-size: .875rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; cursor: pointer; }
.btn:hover:not(:disabled) { background: transparent; color: var(--bone); }
.btn.ghost { background: transparent; color: var(--bone); border-color: var(--line-strong); }
.btn.ghost:hover { border-color: var(--bone); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: wait; }
.link { background: none; border: 0; padding: 6px 0; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
.link.danger { color: var(--bad); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: .8125rem; font-weight: 500; color: var(--smoke); }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 0; }
.field textarea { min-height: 110px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--bone); outline: none; }
.hint { font-size: .8125rem; color: var(--smoke); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.form { display: grid; gap: 20px; }
.box { display: grid; gap: 16px; padding: 20px; background: var(--panel); border: 1px solid var(--line); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--bone); }

/* elenco opere */
.filters { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 16px; }
.chip { border: 1px solid var(--line-strong); background: transparent; padding: 6px 12px; font-size: .8125rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--bone); color: var(--bg); border-color: var(--bone); }
.list { display: grid; border-top: 1px solid var(--line-strong); }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.row img { width: 64px; height: 80px; object-fit: cover; background: var(--raise); }
.row .t { display: grid; min-width: 0; }
.row .t b { font: 600 1.1rem/1.2 var(--display); overflow-wrap: anywhere; }
.pill { font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line-strong); padding: 3px 8px; white-space: nowrap; }
.pill.on { background: var(--bone); color: var(--bg); border-color: var(--bone); }
.pill.sold { color: var(--bad); border-color: var(--bad); }
.price { font-variant-numeric: tabular-nums; }
.empty { padding: 28px 0; color: var(--smoke); }

/* foto */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.slot { display: grid; gap: 6px; align-content: start; }
.slot img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--raise); }
.slot-tools { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: .8125rem; }
.slot-tools .link { padding: 2px 0; }
.add { aspect-ratio: 4 / 5; display: grid; place-content: center; gap: 4px; text-align: center; border: 1px dashed var(--line-strong); background: transparent; cursor: pointer; font-weight: 500; }
.add:hover { border-color: var(--bone); }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; }
.photo-one { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.photo-one img { width: 160px; aspect-ratio: 4 / 5; object-fit: cover; background: var(--raise); }
.photo-one.wide img { width: 260px; aspect-ratio: 16 / 10; }

/* misure */
.vrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; }

/* barra di salvataggio */
.savebar { position: sticky; bottom: 0; z-index: 10; background: rgba(11,11,10,.96); border-top: 1px solid var(--line-strong); padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); margin-top: 8px; }
.savebar .wrap { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 50; background: var(--bone); color: var(--bg); padding: 12px 18px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.bad { background: var(--bad); color: #160806; }
.status { min-height: 1.4em; font-weight: 500; }
.status.bad { color: var(--bad); }

@media (max-width: 700px) {
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: 56px minmax(0, 1fr) auto; }
  .row .price { display: none; }
  .row img { width: 56px; height: 70px; }
  .vrow { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ===== Dati e collegamento con Netlify ===== */
const TEXT_FIELDS = [
  ["heroTag", "Copertina, sottotitolo sotto il nome", false],
  ["lead", "Biografia, primo paragrafo", true],
  ["bio2", "Biografia, secondo paragrafo", true],
  ["bio3", "Biografia, terzo paragrafo", true],
  ["s1", "Dichiarazione d'artista, prima parte", true],
  ["s2", "Dichiarazione d'artista, seconda parte", true],
  ["roomO", "Testo della sala Opere originali", true],
  ["roomP", "Testo della sala Stampe fine art", true],
  ["ctaTitle", "Invito ai contatti", false],
  ["carePack", "Imballaggio", true],
  ["careCert", "Certificato di autenticità", true]
];
const MAX_PHOTOS = 8;

let password = "";
try { password = localStorage.getItem("vi-gestione") || sessionStorage.getItem("vi-gestione") || ""; } catch (e) {}
let WORKS = [], S = {};
let tab = "opere", editing = null, filter = "all", dirty = false, busy = false;
let draftImages = [];

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const money = n => new Intl.NumberFormat("it-IT", { style:"currency", currency:"EUR", minimumFractionDigits: Number.isInteger(n) ? 0 : 2 }).format(n || 0);
const num = (v, d = null) => v === "" || v === null || v === undefined || isNaN(Number(v)) ? d : Number(v);
const fmtDate = s => new Intl.DateTimeFormat("it-IT", { day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" }).format(new Date(s));

function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("bad", !!bad); t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 3500);
}
async function api(path, opts = {}) {
  const res = await fetch("/api/" + path, { ...opts, headers: { "x-password": password, ...(opts.headers || {}) } });
  let body = null; try { body = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error((body && body.error) || res.status); err.code = (body && body.error) || res.status; throw err; }
  return body;
}
function normalizeWork(w) {
  const images = (Array.isArray(w.images) ? w.images : w.image ? [w.image] : []).filter(Boolean);
  return { id:w.id, type:w.type === "print" ? "print" : "original", titleIt:w.titleIt || "", titleEn:w.titleEn || "", techIt:w.techIt || "", techEn:w.techEn || "",
    year:num(w.year), edition:num(w.edition), release:w.release || "", images, image:images[0] || null, hidden:!!w.hidden, order:num(w.order, 0),
    variants:(w.variants || []).map(v => ({ size:String(v.size || ""), price:num(v.price, 0), stock:Math.max(0, num(v.stock, 0)) })) };
}
async function loadAll() {
  const live = await fetch("/api/data", { cache:"no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const works = Array.isArray(live.works) ? live.works : await fetch("/data/works.json", { cache:"no-cache" }).then(r => r.ok ? r.json() : []).catch(() => []);
  const settings = live.settings || await fetch("/content/settings.json", { cache:"no-cache" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  WORKS = works.map(normalizeWork).sort((a, b) => a.order - b.order);
  S = { notice:{ on:false, it:"", en:"" }, texts:{ it:{}, en:{} }, ...settings };
  S.notice = { on:false, it:"", en:"", ...(S.notice || {}) };
  S.texts = { it:{ ...(S.texts && S.texts.it) }, en:{ ...(S.texts && S.texts.en) } };
}
async function saveWorks(msg) {
  WORKS.forEach((w, i) => { w.order = i + 1; w.image = w.images[0] || null; });
  await api("works", { method:"PUT", headers:{ "content-type":"application/json" }, body:JSON.stringify(WORKS) });
  toast(msg || "Salvato. Il sito è già aggiornato.");
}
async function saveSettings(msg) {
  await api("settings", { method:"PUT", headers:{ "content-type":"application/json" }, body:JSON.stringify(S) });
  toast(msg || "Salvato. Il sito è già aggiornato.");
}
const saveError = e => toast(e.code === "wrong" ? "La password non è più valida. Esci e rientra." : "Non salvato. Controlla la connessione e riprova.", true);

/* Le foto vengono ridotte prima del caricamento, così restano leggere e veloci. */
async function shrink(file, max = 2000) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error("foto")), "image/jpeg", .86));
}
async function upload(file) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) && !/\.(jpe?g|png|webp|heic)$/i.test(file.name)) throw Object.assign(new Error("type"), { code:"type" });
  let blob;
  try { blob = await shrink(file); } catch (e) { throw Object.assign(new Error("read"), { code:"read" }); }
  const res = await api("upload", { method:"POST", headers:{ "content-type":"image/jpeg" }, body:blob });
  return res.url;
}
const uploadError = e => toast(e.code === "type" ? "Formato non supportato. Usa una foto JPG, PNG o WebP." : e.code === "read" ? "Questa foto non si riesce a leggere. Prova a esportarla in JPG." : e.code === "wrong" ? "La password non è più valida. Esci e rientra." : "Foto non caricata. Riprova.", true);

/* ===== Viste ===== */
function viewLogin(msg) {
  return `<div class="login"><form id="loginForm" novalidate>
    <img src="/assets/logo.png" width="360" height="360" alt="">
    <h1>Gestione</h1>
    <p class="muted">Vincenzo Izzi · opere, foto e testi del sito</p>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <label class="check" style="width:100%"><input id="remember" type="checkbox" checked> Ricordami su questo dispositivo</label>
    <p class="status bad" id="loginMsg" aria-live="polite">${esc(msg || "")}</p>
    <button class="btn wide" type="submit">Entra</button>
    <a class="note" href="/">Torna al sito</a>
  </form></div>`;
}
function stateOf(w) {
  if (w.hidden) return ["Nascosta", ""];
  if (w.release && new Date(w.release) > new Date()) return [`Drop ${fmtDate(w.release)}`, "on"];
  return w.variants.some(v => v.stock > 0) ? ["In vendita", ""] : [w.type === "original" ? "Venduta" : "Esaurita", "sold"];
}
const thumb = src => src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'%3E%3Crect width='4' height='5' fill='%231e1e1b'/%3E%3C/svg%3E">`;

function viewWorks() {
  const list = WORKS.map((w, i) => ({ w, i })).filter(({ w }) => filter === "all" || w.type === filter);
  return `<div class="head"><div><p class="label">Opere e stampe</p><h2>${WORKS.length} opere sul sito</h2></div>
      <button class="btn" type="button" data-act="new">+ Nuova opera</button></div>
    <div class="filters" role="group" aria-label="Filtra">
      <button class="chip" data-filter="all" aria-pressed="${filter === "all"}">Tutte</button>
      <button class="chip" data-filter="original" aria-pressed="${filter === "original"}">Originali</button>
      <button class="chip" data-filter="print" aria-pressed="${filter === "print"}">Stampe</button>
    </div>
    <div class="list">${list.length ? list.map(({ w, i }) => { const [st, cls] = stateOf(w); return `<div class="row">
      ${thumb(w.images[0])}
      <div class="t"><b>${esc(w.titleIt || "Senza titolo")}</b><span class="note">${w.type === "original" ? "Opera originale" : "Stampa fine art"}${w.year ? " · " + w.year : ""} · <span class="pill ${cls}">${esc(st)}</span></span></div>
      <span class="price">${w.variants.length ? money(Math.min(...w.variants.map(v => v.price))) : ""}</span>
      <div style="display:flex;gap:14px;align-items:center">
        <button class="link" data-up="${i}" aria-label="Sposta su" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="btn ghost" style="min-height:40px;padding:6px 14px" data-edit="${i}">Modifica</button>
      </div></div>`; }).join("") : `<p class="empty">Nessuna opera in questo elenco.</p>`}</div>
    <p class="note" style="padding-top:14px">Le frecce ↑ spostano un'opera più in alto nell'ordine del sito.</p>`;
}
function variantRow(v) {
  return `<div class="vrow">
    <div class="field"><label>Misura</label><input data-v="size" value="${esc(v.size)}" placeholder="50 × 70 cm"></div>
    <div class="field"><label>Prezzo (€)</label><input data-v="price" type="number" min="0" step="1" inputmode="numeric" value="${esc(v.price || "")}"></div>
    <div class="field"><label>Disponibili</label><input data-v="stock" type="number" min="0" step="1" inputmode="numeric" value="${esc(v.stock)}"></div>
    <button type="button" class="link danger" data-act="rmv">Togli</button>
  </div>`;
}
function slots() {
  return draftImages.map((src, i) => `<div class="slot">
      <img src="${esc(src)}" alt="Foto ${i + 1}">
      <div class="slot-tools">${i === 0 ? `<span class="note">Principale</span>` : `<button type="button" class="link" data-main="${i}">Principale</button>`}<button type="button" class="link danger" data-rmimg="${i}">Togli</button></div>
    </div>`).join("") + (draftImages.length < MAX_PHOTOS ? `<button type="button" class="add" data-act="pick"><span style="font-size:1.6rem">+</span><span>Aggiungi foto</span><span class="note">anche più di una</span></button>` : "");
}
const toLocal = iso => { if (!iso) return ""; const d = new Date(iso); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
function viewEdit() {
  const isNew = editing === "new";
  const w = isNew ? { type:"original", titleIt:"", titleEn:"", techIt:"Carboncino su carta", techEn:"Charcoal on paper", year:new Date().getFullYear(), edition:null, release:"", hidden:false, variants:[{ size:"", price:"", stock:1 }] } : WORKS[editing];
  return `<button class="link" data-act="back">← Torna all'elenco</button>
    <div class="head" style="padding-top:12px"><h2>${isNew ? "Nuova opera" : esc(w.titleIt)}</h2></div>
    <form id="workForm" class="form" novalidate>
      <div class="box"><h3>Foto</h3>
        <p class="hint">Fino a ${MAX_PHOTOS} foto. La prima è quella che si vede nell'elenco. Puoi caricarle direttamente dal telefono.</p>
        <div class="slots" id="slots">${slots()}</div>
        <input class="file" id="workFiles" type="file" accept="image/*" multiple aria-label="Scegli le foto">
      </div>
      <div class="box"><h3>Informazioni</h3>
        <div class="grid2">
          <div class="field"><label for="type">Tipo</label><select id="type">
            <option value="original"${w.type === "original" ? " selected" : ""}>Opera originale (si chiede informazioni)</option>
            <option value="print"${w.type === "print" ? " selected" : ""}>Stampa fine art (si compra online)</option></select></div>
          <div class="field"><label for="year">Anno</label><input id="year" type="number" inputmode="numeric" value="${esc(w.year ?? "")}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="titleIt">Titolo</label><input id="titleIt" value="${esc(w.titleIt)}" required></div>
          <div class="field"><label for="titleEn">Titolo in inglese (facoltativo)</label><input id="titleEn" value="${esc(w.titleEn)}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="techIt">Tecnica</label><input id="techIt" value="${esc(w.techIt)}" placeholder="Carboncino su carta"></div>
          <div class="field"><label for="techEn">Tecnica in inglese (facoltativo)</label><input id="techEn" value="${esc(w.techEn)}" placeholder="Charcoal on paper"></div>
        </div>
      </div>
      <div class="box"><h3>Misure, prezzi e disponibilità</h3>
        <p class="hint">Quando un'opera viene venduta o una stampa pagata, abbassa "Disponibili". A zero sul sito compare Venduta o Esaurita.</p>
        <div id="variants" class="form" style="gap:12px">${w.variants.map(variantRow).join("")}</div>
        <div><button type="button" class="link" data-act="addv">+ Aggiungi un'altra misura</button></div>
        <div class="field" id="editionField"><label for="edition">Copie dell'edizione (solo stampe)</label><input id="edition" type="number" min="0" inputmode="numeric" value="${esc(w.edition ?? "")}" placeholder="30"><span class="hint">Sul sito compare come "Limitata a 30 copie".</span></div>
      </div>
      <div class="box"><h3>Drop e visibilità</h3>
        <div class="field"><label for="release">Data e ora di uscita (facoltativo)</label><input id="release" type="datetime-local" value="${toLocal(w.release)}">
          <span class="hint">Lascia vuoto per metterla subito in vendita. Con una data futura il sito mostra "In uscita il…" e la apre da solo all'ora indicata.</span></div>
        <label class="check"><input id="hidden" type="checkbox" ${w.hidden ? "checked" : ""}> Nascondi dal sito</label>
      </div>
      ${isNew ? "" : `<div><button type="button" class="link danger" data-act="del">Elimina questa opera</button></div>`}
      <div class="savebar"><div class="wrap" style="padding:0">
        <span class="status" id="formMsg" aria-live="polite"></span>
        <button class="btn" type="submit">Salva l'opera</button>
      </div></div>
    </form>`;
}
function viewPhotos() {
  return `<div class="head"><div><p class="label">Foto</p><h2>Foto dell'artista e copertina</h2></div></div>
    <div class="form">
      <div class="box"><h3>Foto dell'artista</h3>
        <div class="photo-one">${thumb(S.portrait)}
          <div class="form" style="gap:8px"><button type="button" class="btn" data-pickone="portrait">Cambia foto</button>
          <span class="hint">Compare nella home e nella biografia, sempre in bianco e nero.</span></div></div></div>
      <div class="box"><h3>Copertina della home</h3>
        <div class="photo-one wide">${thumb(S.hero)}
          <div class="form" style="gap:8px"><button type="button" class="btn" data-pickone="hero">${S.hero ? "Cambia copertina" : "Carica copertina"}</button>
          ${S.hero ? `<button type="button" class="link danger" data-act="hero-rm">Togli la copertina</button>` : ""}
          <span class="hint">Foto orizzontale a tutto schermo, mostrata in bianco e nero. Se è vuota si usa la prima opera con foto.</span></div></div></div>
      <input class="file" id="oneFile" type="file" accept="image/*" aria-label="Scegli la foto">
    </div>`;
}
function viewTexts() {
  const t = S.texts;
  return `<div class="head"><div><p class="label">Testi</p><h2>Testi del sito</h2></div></div>
    <form id="textsForm" class="form">
      <p class="hint">Se lasci un campo vuoto, il sito usa il testo di partenza.</p>
      ${TEXT_FIELDS.map(([k, label, long]) => `<div class="box"><h3>${label}</h3><div class="grid2">
        <div class="field"><label for="it-${k}">Italiano</label>${long ? `<textarea id="it-${k}" rows="5">${esc(t.it[k])}</textarea>` : `<input id="it-${k}" value="${esc(t.it[k])}">`}</div>
        <div class="field"><label for="en-${k}">English</label>${long ? `<textarea id="en-${k}" rows="5">${esc(t.en[k])}</textarea>` : `<input id="en-${k}" value="${esc(t.en[k])}">`}</div>
      </div></div>`).join("")}
      <div class="savebar"><div class="wrap" style="padding:0"><span class="note">Le modifiche si vedono sul sito appena salvi.</span><button class="btn" type="submit">Salva i testi</button></div></div>
    </form>`;
}
function viewSettings() {
  return `<div class="head"><div><p class="label">Impostazioni</p><h2>Contatti, pagamento e avvisi</h2></div></div>
    <form id="settingsForm" class="form">
      <div class="box"><h3>Avviso in alto</h3>
        <p class="hint">Una riga in cima a tutte le pagine, per esempio per annunciare un nuovo drop.</p>
        <div class="grid2">
          <div class="field"><label for="noticeIt">Testo</label><input id="noticeIt" value="${esc(S.notice.it)}" placeholder="Nuovo drop: stampe disponibili dal 5 dicembre"></div>
          <div class="field"><label for="noticeEn">Testo in inglese</label><input id="noticeEn" value="${esc(S.notice.en)}" placeholder="New drop: prints available from 5 December"></div>
        </div>
        <label class="check"><input id="noticeOn" type="checkbox" ${S.notice.on ? "checked" : ""}> Mostra l'avviso sul sito</label>
      </div>
      <div class="box"><h3>Contatti</h3>
        <div class="grid2">
          <div class="field"><label for="whatsapp">Numero WhatsApp</label><input id="whatsapp" type="tel" value="${esc(S.whatsapp)}" placeholder="349 542 1157"></div>
          <div class="field"><label for="email">Email</label><input id="email" type="email" value="${esc(S.email)}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="instagram">Link Instagram</label><input id="instagram" type="url" value="${esc(S.instagram)}"></div>
          <div class="field"><label for="instagramName">Nome Instagram mostrato</label><input id="instagramName" value="${esc(S.instagramName)}"></div>
        </div>
      </div>
      <div class="box"><h3>Pagamento e spedizione delle stampe</h3>
        <div class="grid3">
          <div class="field"><label for="paypal">Nome PayPal.me</label><input id="paypal" value="${esc(S.paypal)}"></div>
          <div class="field"><label for="shipIT">Spedizione Italia (€)</label><input id="shipIT" type="number" min="0" step="0.5" value="${esc(S.shipIT)}"></div>
          <div class="field"><label for="shipINT">Spedizione estero (€)</label><input id="shipINT" type="number" min="0" step="0.5" value="${esc(S.shipINT)}"></div>
        </div>
        <p class="hint">Il pagamento apre paypal.me con l'importo già scritto. Prima di spedire controlla sempre su PayPal di aver ricevuto il pagamento.</p>
      </div>
      <div class="box"><h3>Sito in anteprima</h3>
        <label class="check"><input id="demo" type="checkbox" ${S.demo ? "checked" : ""}> Mostra in alto "Anteprima del sito. Opere e prezzi sono esempi."</label>
        <p class="hint">Togli la spunta quando opere e prezzi sono quelli veri.</p>
      </div>
      <div class="savebar"><div class="wrap" style="padding:0"><span class="note">Le modifiche si vedono sul sito appena salvi.</span><button class="btn" type="submit">Salva le impostazioni</button></div></div>
    </form>`;
}
function render() {
  const app = $("app");
  if (!password) { app.innerHTML = viewLogin(); $("pw")?.focus(); return; }
  const tabs = [["opere","Opere"],["foto","Foto"],["testi","Testi"],["impostazioni","Impostazioni"]];
  const body = tab === "opere" ? (editing !== null ? viewEdit() : viewWorks()) : tab === "foto" ? viewPhotos() : tab === "testi" ? viewTexts() : viewSettings();
  app.innerHTML = `<header><div class="wrap">
      <div class="bar"><div class="brand"><img src="/assets/logo.png" width="360" height="360" alt=""><b>Vincenzo Izzi</b><span>Gestione</span></div>
        <div class="bar-links"><a href="/" target="_blank" rel="noopener">Apri il sito ↗</a><button class="link" data-act="logout">Esci</button></div></div>
      <nav class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</nav>
    </div></header>
    <main class="wrap">${body}</main>`;
  syncEdition();
}
function syncEdition() { const t = $("type"), f = $("editionField"); if (t && f) f.hidden = t.value !== "print"; }

/* ===== Azioni ===== */
function readWorkForm() {
  const f = id => $(id);
  const variants = [...document.querySelectorAll(".vrow")].map(r => ({
    size: r.querySelector('[data-v="size"]').value.trim(),
    price: num(r.querySelector('[data-v="price"]').value, 0),
    stock: Math.max(0, Math.floor(num(r.querySelector('[data-v="stock"]').value, 0)))
  })).filter(v => v.size || v.price);
  return {
    type:f("type").value, titleIt:f("titleIt").value.trim(), titleEn:f("titleEn").value.trim(),
    techIt:f("techIt").value.trim(), techEn:f("techEn").value.trim(), year:num(f("year").value),
    edition: f("type").value === "print" ? num(f("edition").value) : null,
    release: f("release").value ? new Date(f("release").value).toISOString() : "",
    hidden:f("hidden").checked, images:[...draftImages], variants
  };
}
const slug = s => (s || "opera").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "opera";
async function submitWork() {
  const msg = $("formMsg"), d = readWorkForm();
  const fail = t => { msg.textContent = t; msg.classList.add("bad"); };
  if (!d.titleIt) return fail("Scrivi il titolo.");
  if (!d.variants.length) return fail("Aggiungi almeno una misura con il prezzo.");
  if (d.variants.some(v => !v.size || !(v.price > 0))) return fail("Ogni misura deve avere misura e prezzo.");
  if (d.type === "print" && !d.edition) return fail("Per una stampa indica le copie dell'edizione.");
  const before = JSON.stringify(WORKS);
  if (editing === "new") {
    let id = slug(d.titleIt), n = 2; while (WORKS.some(w => w.id === id)) id = `${slug(d.titleIt)}-${n++}`;
    WORKS.unshift({ id, ...d, order:0 });
  } else Object.assign(WORKS[editing], d);
  busy = true; msg.textContent = "Salvataggio in corso…"; msg.classList.remove("bad");
  try { await saveWorks(); dirty = false; editing = null; render(); window.scrollTo(0, 0); }
  catch (e) { WORKS = JSON.parse(before); fail(""); saveError(e); }
  busy = false;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button, [data-tab]");
  if (!b || b.disabled) return;
  if (b.dataset.tab) { if (dirty && !confirmLeave(b)) return; tab = b.dataset.tab; editing = null; dirty = false; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.filter) { filter = b.dataset.filter; render(); return; }
  if (b.dataset.edit !== undefined) { editing = Number(b.dataset.edit); draftImages = [...WORKS[editing].images]; dirty = false; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.up !== undefined) {
    const i = Number(b.dataset.up); if (i < 1) return;
    [WORKS[i - 1], WORKS[i]] = [WORKS[i], WORKS[i - 1]]; render();
    try { await saveWorks("Ordine aggiornato."); } catch (err) { saveError(err); }
    return;
  }
  if (b.dataset.main !== undefined) { const [x] = draftImages.splice(Number(b.dataset.main), 1); draftImages.unshift(x); dirty = true; $("slots").innerHTML = slots(); return; }
  if (b.dataset.rmimg !== undefined) { draftImages.splice(Number(b.dataset.rmimg), 1); dirty = true; $("slots").innerHTML = slots(); return; }
  if (b.dataset.pickone) { const f = $("oneFile"); f.dataset.target = b.dataset.pickone; f.click(); return; }
  switch (b.dataset.act) {
    case "new": editing = "new"; draftImages = []; dirty = false; render(); window.scrollTo(0, 0); break;
    case "back": if (dirty && !confirmLeave(b)) return; editing = null; dirty = false; render(); window.scrollTo(0, 0); break;
    case "pick": $("workFiles").click(); break;
    case "addv": $("variants").insertAdjacentHTML("beforeend", variantRow({ size:"", price:"", stock:1 })); dirty = true; break;
    case "rmv": b.closest(".vrow").remove(); dirty = true; break;
    case "del": {
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Tocca di nuovo per eliminarla definitivamente"; return; }
      const before = JSON.stringify(WORKS); WORKS.splice(editing, 1);
      try { await saveWorks("Opera eliminata."); editing = null; dirty = false; render(); } catch (err) { WORKS = JSON.parse(before); saveError(err); }
      break;
    }
    case "hero-rm": { const old = S.hero; S.hero = ""; try { await saveSettings("Copertina tolta."); } catch (err) { S.hero = old; saveError(err); } render(); break; }
    case "logout": password = ""; try { localStorage.removeItem("vi-gestione"); sessionStorage.removeItem("vi-gestione"); } catch (err) {} render(); break;
  }
});
/* Uscire con modifiche non salvate chiede una seconda conferma sullo stesso pulsante. */
function confirmLeave(b) {
  if (b.dataset.leave === "1") return true;
  b.dataset.leave = "1"; toast("Hai modifiche non salvate. Tocca di nuovo per uscire senza salvare.", true);
  setTimeout(() => { delete b.dataset.leave; }, 4000);
  return false;
}
document.addEventListener("input", e => { if (e.target.closest("#workForm")) dirty = true; });
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "type") { syncEdition(); return; }
  if (el.id === "workFiles" && el.files.length) {
    const files = [...el.files].slice(0, MAX_PHOTOS - draftImages.length);
    el.value = "";
    for (const [n, f] of files.entries()) {
      toast(`Caricamento foto ${n + 1} di ${files.length}…`);
      try { draftImages.push(await upload(f)); dirty = true; $("slots").innerHTML = slots(); }
      catch (err) { uploadError(err); return; }
    }
    toast("Foto caricate. Premi Salva l'opera per pubblicarle.");
    return;
  }
  if (el.id === "oneFile" && el.files.length) {
    const target = el.dataset.target, f = el.files[0]; el.value = "";
    toast("Caricamento della foto…");
    try {
      const url = await upload(f); const old = S[target]; S[target] = url;
      try { await saveSettings(target === "hero" ? "Copertina aggiornata." : "Foto dell'artista aggiornata."); } catch (err) { S[target] = old; saveError(err); }
      render();
    } catch (err) { uploadError(err); }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target;
  if (busy) return;
  if (form.id === "loginForm") {
    const pw = $("pw").value, msg = $("loginMsg"), btn = form.querySelector("button");
    if (!pw) { msg.textContent = "Scrivi la password."; return; }
    btn.disabled = true; msg.textContent = "";
    password = pw;
    try {
      await api("login", { method:"POST" });
      try { ($("remember").checked ? localStorage : sessionStorage).setItem("vi-gestione", pw); } catch (err) {}
      await loadAll(); render();
    } catch (err) {
      password = "";
      render();
      $("loginMsg").textContent = err.code === "wrong" ? "Password sbagliata. Riprova." : err.code === "nopassword" ? "La password non è ancora stata impostata su Netlify (variabile ADMIN_PASSWORD)." : "Il servizio non risponde. Controlla la connessione e riprova.";
    }
    return;
  }
  if (form.id === "workForm") { submitWork(); return; }
  if (form.id === "textsForm") {
    const before = JSON.stringify(S.texts);
    TEXT_FIELDS.forEach(([k]) => { S.texts.it[k] = $("it-" + k).value.trim(); S.texts.en[k] = $("en-" + k).value.trim(); });
    busy = true; try { await saveSettings("Testi salvati. Il sito è già aggiornato."); } catch (err) { S.texts = JSON.parse(before); saveError(err); } busy = false;
    return;
  }
  if (form.id === "settingsForm") {
    const before = JSON.stringify(S);
    let wa = $("whatsapp").value.replace(/\D/g, "").replace(/^00/, "");
    if (wa.length === 10 && wa.startsWith("3")) wa = "39" + wa;
    if (!wa) { toast("Scrivi il numero WhatsApp.", true); return; }
    Object.assign(S, { whatsapp:wa, email:$("email").value.trim(), instagram:$("instagram").value.trim(), instagramName:$("instagramName").value.trim(),
      paypal:$("paypal").value.trim(), shipIT:num($("shipIT").value, 0), shipINT:num($("shipINT").value, 0), demo:$("demo").checked,
      notice:{ on:$("noticeOn").checked, it:$("noticeIt").value.trim(), en:$("noticeEn").value.trim() } });
    busy = true; try { await saveSettings("Impostazioni salvate. Il sito è già aggiornato."); render(); } catch (err) { Object.assign(S, JSON.parse(before)); saveError(err); } busy = false;
  }
});

(async function start() {
  if (!password) { render(); return; }
  try { await api("login", { method:"POST" }); await loadAll(); render(); }
  catch (e) { password = ""; render(); }
})();
</script>
</body>
</html>
