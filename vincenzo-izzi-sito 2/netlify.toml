[build]
  command = "node build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# La vecchia pagina /admin porta alla nuova gestione.
[[redirects]]
  from = "/admin/*"
  to = "/gestione/"
  status = 302
  force = true

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/gestione/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"
